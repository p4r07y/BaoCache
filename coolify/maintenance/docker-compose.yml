services:
  cupdien-maintenance:
    build:
      context: ..
      dockerfile: maintenance/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    labels:
      # Stable service name consumed by cupdienlamdong-errors@file.
      - "traefik.enable=true"
      - "traefik.http.services.cupdien-maintenance.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    init: true
    pids_limit: 50
    mem_limit: 64m
    cpus: 0.10
