server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nginx stays available while PHP-FPM/WordPress is starting. This catches
    # only upstream failures; the standalone Traefik fallback handles the case
    # where this Nginx container itself has not been routed yet.
    error_page 502 503 504 =503 /__baocache/maintenance.html;
    location = /__baocache/maintenance.html {
        internal;
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Retry-After "120" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # This is reachable only with the first-boot generated Basic Auth secret.
    # It is not linked from the site and accepts POST only. BaoCache calls it
    # over Docker DNS, preserving the public Host header to match the FastCGI
    # key that was used when the page was cached. The path travels in a private
    # header rather than a query argument, avoiding percent-encoding differences
    # between WordPress and the FastCGI cache key.
    location = /__baocache/purge {
        limit_except POST { deny all; }
        auth_basic "BaoCache internal purge";
        auth_basic_user_file /run/baocache-secrets/purge.htpasswd;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        fastcgi_cache_purge WORDPRESS "${scheme}${host}$http_x_baocache_purge_uri";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        access_log off;
        log_not_found off;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/wp-content/cache/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Protect Wordfence Extended Protection configuration and other dot-files.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP loads this internally through auto_prepend_file; HTTP never should.
    location = /wordfence-waf.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(?:wp-config\.php|readme\.html|license\.txt|composer\.(?:json|lock))$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:bak|conf|dist|env|ini|log|old|orig|sh|sql|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # WordPress exposes an "All Settings" screen at this endpoint on GET. It
    # lists sensitive option values to an authenticated administrator, including
    # salts stored by plugins. Settings saves use POST, so deny direct viewing
    # while preserving the normal WordPress Settings API workflow.
    location = /wp-admin/options.php {
        limit_except POST { deny all; }
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_pass wordpress:9000;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
    }

    location ~ \.php$ {
        try_files $uri =404;

        set $skip_cache 0;
        if ($skip_cache_method) { set $skip_cache 1; }
        if ($skip_cache_query)  { set $skip_cache 1; }
        if ($skip_cache_uri)    { set $skip_cache 1; }
        if ($skip_cache_cookie) { set $skip_cache 1; }
        if ($skip_cache_authorization) { set $skip_cache 1; }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;

        fastcgi_pass wordpress:9000;
        fastcgi_intercept_errors on;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        fastcgi_cache WORDPRESS;
        fastcgi_cache_methods GET HEAD;
        # Do not include $request_method: nginx normalizes HEAD through GET
        # cache conversion, and a shared key makes one exact purge complete.
        fastcgi_cache_key "$scheme$host$request_uri";
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_no_cache $upstream_http_set_cookie;
        fastcgi_cache_valid 200 10m;
        fastcgi_cache_valid 301 1h;
        fastcgi_cache_lock on;
        fastcgi_cache_background_update on;
        fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;

        add_header X-FastCGI-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        fastcgi_hide_header X-Powered-By;
        access_log /var/lib/baocache/fastcgi-cache.log baocache_cache;
    }

    location ~* \.(?:css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
}
