<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Đang cập nhật hệ thống</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #1b2a4d; background: radial-gradient(circle at 85% 10%, #dce7ff, transparent 35%), #f5f7fb; }
    main { width: min(100%, 540px); padding: 44px; border: 1px solid #e1e7f2; border-radius: 20px; background: rgba(255,255,255,.96); box-shadow: 0 20px 55px rgba(24, 48, 110, .12); text-align: center; }
    .mark { width: 58px; height: 58px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 18px; color: #fff; background: linear-gradient(135deg, #3858e9, #7090ff); font-size: 26px; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: -.04em; }
    p { margin: 15px auto 0; max-width: 400px; color: #63708a; font-size: 16px; line-height: 1.65; }
    .note { margin-top: 25px; color: #8490a5; font-size: 13px; }
    button { margin-top: 27px; border: 0; border-radius: 9px; padding: 12px 18px; color: #fff; background: #3858e9; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover, button:focus { background: #263fb8; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⚡</div>
    <h1>Website đang được cập nhật</h1>
    <p>Chúng tôi đang hoàn tất một cập nhật ngắn để website hoạt động ổn định hơn. Vui lòng thử lại sau ít phút.</p>
    <button type="button" onclick="window.location.reload()">Thử lại</button>
    <p class="note">Cảm ơn bạn đã kiên nhẫn.</p>
  </main>
</body>
</html>
