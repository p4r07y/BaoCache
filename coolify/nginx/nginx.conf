load_module /etc/nginx/modules/ngx_http_cache_purge_module.so;

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time '
                    'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;
    # The third field is a bounded diagnostic category, never a URL, cookie,
    # authorization value or visitor identifier.
    log_format baocache_cache '$msec $upstream_cache_status $baocache_skip_reason';

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    client_max_body_size 64m;
    client_body_timeout 60s;
    send_timeout 60s;

    # Only Coolify's internal proxy should reach Nginx. Restore the real visitor
    # address so Wordfence rate limits and blocks the correct client.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    fastcgi_cache_path /var/cache/nginx/wordpress
        levels=1:2
        keys_zone=WORDPRESS:32m
        inactive=60m
        max_size=1g
        use_temp_path=off;

    # Exact-key purge is synchronous. Wildcard purge is deliberately disabled:
    # WordPress sends only canonical, same-site URLs through the authenticated
    # internal endpoint in default.conf.
    cache_purge_response_type json;
    cache_purge_vary_aware on;
    cache_purge_legacy_status off;

    map $request_method $skip_cache_method {
        default 1;
        GET 0;
        HEAD 0;
    }

    map $query_string $skip_cache_query {
        default 1;
        "" 0;
    }

    map $request_uri $skip_cache_uri {
        default 0;
        ~*^/wp-admin(?:/|$) 1;
        ~*^/wp-login\.php 1;
        ~*^/wp-cron\.php 1;
        ~*^/wp-json(?:/|$) 1;
        ~*^/xmlrpc\.php 1;
        ~*^/cart(?:/|$) 1;
        ~*^/checkout(?:/|$) 1;
        ~*^/my-account(?:/|$) 1;
        ~*^/wc-api(?:/|$) 1;
    }

    map $http_cookie $skip_cache_cookie {
        default 0;
        ~*wordpress_logged_in 1;
        ~*comment_author 1;
        ~*wp-postpass 1;
        ~*woocommerce_items_in_cart 1;
        ~*woocommerce_cart_hash 1;
        ~*wp_woocommerce_session_ 1;
    }

    map $http_authorization $skip_cache_authorization {
        default 1;
        "" 0;
    }

    # First matching cause wins. These maps mirror the $skip_cache construction
    # in default.conf and feed the private BaoCache observer only.
    map "$skip_cache_method:$skip_cache_query:$skip_cache_uri:$skip_cache_cookie:$skip_cache_authorization" $baocache_skip_reason {
        default eligible;
        ~^1: method;
        ~^0:1: query;
        ~^0:0:1: path;
        ~^0:0:0:1: cookie;
        ~^0:0:0:0:1$ authorization;
    }

    include /etc/nginx/conf.d/*.conf;
}
